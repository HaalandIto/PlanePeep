server {
    listen 5176;
    server_name localhost;

    # 1. Handle Static React Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Essential for React Router:
        # If a path isn't a file, serve index.html and let React handle the route
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to the Spring Boot Backend
    location /api/ {
        # 'backend' is the service name defined in docker-compose.yml
        proxy_pass http://backend:8080/api/;
        
        # Pass the original host and IP headers so Spring knows who is calling
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard timeouts for longer-running API calls
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Optional: Proxy WebSocket connections (if using STOMP/WebSockets)
    # location /ws/ {
    #     proxy_pass http://backend:5176/ws/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "Upgrade";
    #     proxy_set_header Host $host;
    # }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}