## THIS PROPERTIES FILE IS FOR TEST ENVIRONMENT
# properties override application.properties
server:
    port: '8000' # Use 8000 so frontend (api.js default BASE_URL) and Vite proxy target can reach backend without "connection refused"
spring:
    datasource:
        url: 'jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE'
        driverClassName: org.h2.Driver
        username: sa
        password: ''
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.H2Dialect
        defer-datasource-initialization: true # Defer Spring's SQL initializer (data.sql) until after Hibernate has created the schema
