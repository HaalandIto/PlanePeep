plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id("com.github.spotbugs") version "6.4.8"
}

group = 'com.planepeep'
version = '0.0.1-SNAPSHOT'
description = 'DB and REST backend for PlanePeep'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

spotbugs {
	ignoreFailures = false
	effort = 'default'
	reportLevel = 'high'  // only high-confidence findings
}

repositories {
    mavenLocal() // this allows us to use the local maven repository, which is useful for testing
	mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
	// MAIN DEPENDENCIES
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-crypto'

	// JWT DEPENDENCIES
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// DATABASE DEPENDENCIES
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.h2database:h2'

	// LOMBOK
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// CACHE DEPENDENCIES (CaffeineCacheManager from spring-context-support)
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework:spring-context-support'//TODO why was this added? is it redundant?
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// OPENSKY API DEPENDENCIES
	// opensky is a flat dependency as it is not available on maven central
	//NOTE our wrapper uses a custom version with a one line fix to default to a UTF-8 charset
    implementation ':opensky-api-1.3.0'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.squareup.okhttp3:okhttp:4.9.3'

	// TEST DEPENDENCIES
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// testImplementation 'org.springframework.boot:spring-boot-starter-web-test' // does not exist
	testImplementation 'org.junit.jupiter:junit-jupiter-api'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.security:spring-security-test'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'test'
}
